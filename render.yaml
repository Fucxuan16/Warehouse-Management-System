services:
  - type: web
    name: warehouse-management-system
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-management-db
          property: connectionString

databases:
  - name: warehouse-management-db
    region: singapore
    plan: basic-256mb
